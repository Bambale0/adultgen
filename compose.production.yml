name: adultgen

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-production}
  APP_NAME: ${APP_NAME:-adultgen}
  API_HOST: 0.0.0.0
  API_PORT: 8000
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  OBJECT_STORAGE_BACKEND: s3
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  S3_REGION_NAME: ${S3_REGION_NAME:-us-east-1}
  S3_TEMP_BUCKET: ${S3_TEMP_BUCKET:-media-temporary}
  S3_PUBLISHED_BUCKET: ${S3_PUBLISHED_BUCKET:-media-published}
  S3_REFERENCES_BUCKET: ${S3_REFERENCES_BUCKET:-media-references}
  S3_WEBHOOK_BUCKET: ${S3_WEBHOOK_BUCKET:-webhook-archive}
  MEDIA_TEMP_TTL_SECONDS: ${MEDIA_TEMP_TTL_SECONDS:-86400}
  TELEGRAM_DEFAULT_WEBHOOK_SECRET: ${TELEGRAM_DEFAULT_WEBHOOK_SECRET}
  TELEGRAM_DEFAULT_BOT_TOKEN: ${TELEGRAM_DEFAULT_BOT_TOKEN}
  KIE_API_BASE_URL: ${KIE_API_BASE_URL:-https://api.kie.ai}
  KIE_API_KEY: ${KIE_API_KEY}
  KIE_CALLBACK_URL: ${KIE_CALLBACK_URL}
  KIE_WEBHOOK_SECRET: ${KIE_WEBHOOK_SECRET:-}
  BILLING_BASE_URL: ${BILLING_BASE_URL}
  SHARPAY_API_KEY: ${SHARPAY_API_KEY:-}
  CROCOPAY_API_KEY: ${CROCOPAY_API_KEY:-}
  CROCOPAY_SECRET: ${CROCOPAY_SECRET:-}
  CROCOPAY_API_BASE_URL: ${CROCOPAY_API_BASE_URL:-https://crocopay.tech}
  CROCOPAY_CLIENT_ID: ${CROCOPAY_CLIENT_ID:-}
  CROCOPAY_CLIENT_SECRET: ${CROCOPAY_CLIENT_SECRET:-}
  JWT_SECRET: ${JWT_SECRET}
  JWT_ACCESS_TOKEN_TTL_SECONDS: ${JWT_ACCESS_TOKEN_TTL_SECONDS:-86400}
  MINI_APP_AUTH_MAX_AGE_SECONDS: ${MINI_APP_AUTH_MAX_AGE_SECONDS:-86400}
  ADMIN_API_TOKEN: ${ADMIN_API_TOKEN}
  ADULT_POLICY_VERSION: ${ADULT_POLICY_VERSION:-adult-policy-v1}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-06T17-38-46Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_TEMP_BUCKET: ${S3_TEMP_BUCKET:-media-temporary}
      S3_PUBLISHED_BUCKET: ${S3_PUBLISHED_BUCKET:-media-published}
      S3_REFERENCES_BUCKET: ${S3_REFERENCES_BUCKET:-media-references}
      S3_WEBHOOK_BUCKET: ${S3_WEBHOOK_BUCKET:-webhook-archive}
    entrypoint: ["/bin/sh", "-c"]
    command: >
      mc alias set adultgen http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
      mc mb --ignore-existing "adultgen/$${S3_TEMP_BUCKET}" &&
      mc mb --ignore-existing "adultgen/$${S3_PUBLISHED_BUCKET}" &&
      mc mb --ignore-existing "adultgen/$${S3_REFERENCES_BUCKET}" &&
      mc mb --ignore-existing "adultgen/$${S3_WEBHOOK_BUCKET}" &&
      mc anonymous set none "adultgen/$${S3_TEMP_BUCKET}" &&
      mc anonymous set none "adultgen/$${S3_PUBLISHED_BUCKET}" &&
      mc anonymous set none "adultgen/$${S3_REFERENCES_BUCKET}" &&
      mc anonymous set none "adultgen/$${S3_WEBHOOK_BUCKET}"
    networks:
      - backend

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: "no"
    environment: *app-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    expose:
      - "8000"
    networks:
      - backend

  web:
    build:
      context: .
      dockerfile: apps/web_app/Dockerfile
      args:
        VITE_CORE_API_URL: /api
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      - frontend
      - backend

  edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    volumes:
      - ./deploy/nginx/adultgen.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${HTTP_PORT:-80}:80"
    networks:
      - frontend
      - backend

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  frontend:
  backend:
