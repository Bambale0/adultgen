name: adultgen

x-backend-env: &backend-env
  env_file:
    - .env.production
  environment:
    APP_ENV: production
    API_HOST: 0.0.0.0
    API_PORT: 8000
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0
    OBJECT_STORAGE_BACKEND: s3
    S3_ENDPOINT_URL: http://minio:9000
    S3_ACCESS_KEY: ${MINIO_ROOT_USER}
    S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    S3_REGION_NAME: ${S3_REGION_NAME:-us-east-1}
    S3_TEMP_BUCKET: ${S3_TEMP_BUCKET:-media-temporary}
    S3_PUBLISHED_BUCKET: ${S3_PUBLISHED_BUCKET:-media-published}
    S3_REFERENCES_BUCKET: ${S3_REFERENCES_BUCKET:-media-references}
    S3_WEBHOOK_BUCKET: ${S3_WEBHOOK_BUCKET:-webhook-archive}
    MEDIA_TEMP_TTL_SECONDS: ${MEDIA_TEMP_TTL_SECONDS:-86400}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - private
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-06T17-38-46Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    networks:
      - private
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  create-buckets:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles: ["setup"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_TEMP_BUCKET: ${S3_TEMP_BUCKET:-media-temporary}
      S3_PUBLISHED_BUCKET: ${S3_PUBLISHED_BUCKET:-media-published}
      S3_REFERENCES_BUCKET: ${S3_REFERENCES_BUCKET:-media-references}
      S3_WEBHOOK_BUCKET: ${S3_WEBHOOK_BUCKET:-webhook-archive}
    networks:
      - private
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      mc alias set adultgen http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}";
      mc mb --ignore-existing adultgen/"$${S3_TEMP_BUCKET}";
      mc mb --ignore-existing adultgen/"$${S3_PUBLISHED_BUCKET}";
      mc mb --ignore-existing adultgen/"$${S3_REFERENCES_BUCKET}";
      mc mb --ignore-existing adultgen/"$${S3_WEBHOOK_BUCKET}";
      mc anonymous set none adultgen/"$${S3_TEMP_BUCKET}";
      mc anonymous set none adultgen/"$${S3_PUBLISHED_BUCKET}";
      mc anonymous set none adultgen/"$${S3_REFERENCES_BUCKET}";
      mc anonymous set none adultgen/"$${S3_WEBHOOK_BUCKET}"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: adultgen-core:${ADULTGEN_IMAGE_TAG:-local}
    profiles: ["migrate"]
    <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private
    command: ["alembic", "upgrade", "head"]

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: adultgen-core:${ADULTGEN_IMAGE_TAG:-local}
    restart: unless-stopped
    <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - private
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/orbital_web/Dockerfile
      args:
        VITE_CORE_API_URL: /api
    image: adultgen-orbital-web:${ADULTGEN_WEB_IMAGE_TAG:-local}
    restart: unless-stopped
    networks:
      - private
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-4444}:80"
    volumes:
      - ./deploy/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - public
      - private
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  public:
  private:
