name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - architecture/mvp-spec

jobs:
  backend-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Pytest
        run: pytest

  web-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web_app/package.json

      - name: Install web dependencies
        working-directory: apps/web_app
        run: npm install

      - name: Typecheck web app
        working-directory: apps/web_app
        run: npm run typecheck

      - name: Lint web app
        working-directory: apps/web_app
        run: npm run lint

      - name: Test web app
        working-directory: apps/web_app
        run: npm run test

      - name: Build web app
        working-directory: apps/web_app
        env:
          VITE_CORE_API_URL: /api
        run: npm run build
